[metadata]
name = specunet_pkg
version = 2.0.4
author = Hongjing Mao, Obblivignes KanchanadeviVenkataraman, Dr. Dongkuan Xu, Dr. Yang Zhang, Dr. Caroline Laplante
author_email = switfluors@gmail.com
description = An implementation of a conventional UNet for spectral image denoising across simulated and experimental datasets with associated evaluation metrics.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/switfluors/SpecUNet.git
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Image Processing
license = MIT

[options]
packages = find_namespace:
include_package_data = True
python_requires = >=3.8
install_requires =
    numpy
    matplotlib
    h5py
    hdf5storage
    pillow
    scipy
    tqdm
    onnx
    onnxscript
    pandas
    openpyxl
    scikit-image
    torch
    torchvision
    torchaudio

[options.package_data]
specunet_pkg = config/*.json, *.md

[options.exclude_package_data]
specunet_pkg = spectra_crop/*, spectra_crop/**/*

[options.packages.find]
where = .
exclude =
    specunet_pkg.spectra_crop*